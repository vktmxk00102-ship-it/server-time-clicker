name: Build Android APK (Stable & Fast)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Gradle 라이브러리 자동 캐싱

      - name: 📦 Install dependencies
        run: npm ci || npm install # package-lock이 없으면 install로 자동 전환

      - name: 🛠 Expo Prebuild
        run: npx expo prebuild --platform android # app.json 설정을 네이티브에 주입

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # 빌드 캐시 활성화

      - name: 🔨 Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --parallel --build-cache

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-time-clicker-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 3
