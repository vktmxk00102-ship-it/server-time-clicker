name: EAS Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache 설정을 지웠습니다. (lock 파일 에러 방지)

      - name: Install Dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        # --non-interactive: 서버에서 자동으로 진행하도록 설정
        # --no-wait: 빌드를 걸어놓고 완료를 기다리지 않음 (GitHub 시간 절약)
        run: eas build --platform android --profile preview --non-interactive --no-wait
