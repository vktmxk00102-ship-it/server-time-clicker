name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 1. 빌드 속도를 비약적으로 높여주는 Gradle 캐시 재활성화
      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install dependencies
        run: |
          npm install
          npx expo install expo-build-properties

      - name: 🛠 Setup EAS
        run: npm install -g eas-cli

      # 2. 빌드 명령어 최적화
      # 불필요한 --clear-cache를 제거하여 속도를 올리되, 
      # 혹시 모를 로컬 환경 변수 충돌을 방지합니다.
      - name: 🚀 Build APK (Local)
        run: |
        cd android && ./gradlew clean && cd ..
          eas build --local --platform android --profile preview --non-interactive
        env:
          NODE_ENV: production
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 3. 결과물 업로드
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-time-clicker-apk
          path: ./*.apk
          retention-days: 7  # 저장 공간 관리를 위해 7일 후 삭제 설정
