name: Optimized EAS Build (Local)

on:
  push:
    branches:
      - main  # 브랜치명이 다르면 수정하세요

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 안드로이드 빌드를 위해 자바 17 설정 (Expo 52 필수)
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 안드로이드 빌드 도구 설정
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🏗️ Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm install

      # --local 플래그를 추가하여 GitHub 서버에서 직접 빌드
      # 빌드 완료 후 파일을 내려받을 수 있도록 --output 경로 지정
      - name: 🚀 Run EAS Build (Local)
        run: |
          npx eas-cli build --platform android --profile preview --local --non-interactive --output=./server-time-clicker.apk

      # 빌드된 APK 파일을 GitHub Actions 결과물로 업로드
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-time-clicker-apk
          path: ./server-time-clicker.apk
