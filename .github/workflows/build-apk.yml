name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # [수정] 캐시 문제 해결을 위해 임시 제거 (나중에 빌드 성공하면 다시 넣으세요)
      # - name: 🐘 Setup Gradle Cache
      #   uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install dependencies
        run: |
          npm install
          # 혹시 모듈 연결이 안 됐을까봐 강제로 연결 시도
          npm install ./modules/expo-clicker-core 
          npx expo install expo-build-properties

      - name: 🛠 Setup EAS
        run: npm install -g eas-cli

      - name: 🚀 Build APK (Local)
        run: |
          export NODE_ENV=production
          # [수정] --clear-cache 옵션 추가 (EAS 내부 캐시 삭제)
          eas build --local --platform android --profile preview --non-interactive --clear-cache
        env:
          NODE_ENV: production
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Gradle에게 캐시 쓰지 말라고 강제 명령
          GRADLE_OPTS: "-Dorg.gradle.caching=false"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-time-clicker-apk
          path: ./*.apk
