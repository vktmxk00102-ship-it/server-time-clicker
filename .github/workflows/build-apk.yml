name: Optimized EAS Build

on:
  push:
    branches:
      - main  # 브랜치명이 다르면 수정하세요 (예: master)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 1. app.json 변경 감지 (tj-actions/changed-files 사용)
      - name: 🔍 Check for app.json changes
        id: check_changes
        uses: tj-actions/changed-files@v44
        with:
          files: |
            app.json

      # 2. Node.js 설정 (캐시 옵션 제거로 lock파일 에러 방지)
      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Expo/EAS 환경 설정
      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-cache: true
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm install

      # 4. 조건부 빌드 (npx eas-cli 사용하여 경로 에러 해결)
      - name: 🚀 Run EAS Build
        run: |
          if [ "${{ steps.check_changes.outputs.any_changed }}" == "true" ]; then
            echo "📢 app.json 변경 감지: 클린 빌드 수행"
            npx eas-cli build --platform android --profile preview --non-interactive --no-wait --clear-cache
          else
            echo "✅ app.json 변경 없음: 일반 빌드 수행"
            npx eas-cli build --platform android --profile preview --non-interactive --no-wait
          fi
