name: Generate Android Folder
on:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Prebuild
        # 이 명령어가 프로젝트의 android 폴더 뼈대를 서버에서 만듭니다.
        run: npx expo prebuild --platform android

      - name: Upload Android Folder
        # 생성된 android 폴더를 우리가 다운로드할 수 있게 보관합니다.
        uses: actions/upload-artifact@v4
        with:
          name: generated-android-folder
          path: android/
