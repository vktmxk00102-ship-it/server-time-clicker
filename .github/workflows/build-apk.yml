name: Build Android APK
on:
  push:
    branches: [ main ] # main 브랜치에 푸시될 때마다 실행 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Expo CLI & Dependencies
        run: |
          npm install -g expo-cli
          npm install

      - name: Build APK (Preview)
        run: |
          # EAS 빌드가 아닌 로컬 빌드 방식으로 APK 생성
          npx expo export
          # 실제 네이티브 빌드를 원할 경우 여기에 eas build 명령어를 추가합니다.
          # 지금은 설정 확인을 위해 기본 빌드 단계만 구성합니다.
