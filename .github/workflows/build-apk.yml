name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 최적화 포인트 1: 캐싱

      - name: 📦 Install dependencies
        run: |
          npm install
          npx expo install expo-build-properties # 최적화 포인트 4: 빌드 플러그인 강제 설치

      - name: 🛠 Setup EAS
        run: npm install -g eas-cli

      - name: 🚀 Build APK (Local)
        run: |
          export NODE_ENV=production
          npx eas-build-local --platform android --profile preview --non-interactive
        env:
          NODE_ENV: production # 최적화 포인트 2: 환경변수 고정

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4 # 최적화 포인트 3: 빌드 결과물 저장
        with:
          name: server-time-clicker-apk
          path: ./*.apk # 생성된 APK 파일을 깃허브 페이지에서 다운로드 가능하게 함
